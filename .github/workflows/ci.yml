name: TRACE-X CI & Deployment Smoke Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Pytest & ANPR Ingest Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (FFmpeg, OpenCV Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Automated Pytest Suite
        run: |
          pytest -v

      - name: Ingestion Smoke Test (Upload, Video Sync, Bayesian Fusion)
        run: |
          python -m pytest backend/tests/test_phase1_ingest.py -v -s
